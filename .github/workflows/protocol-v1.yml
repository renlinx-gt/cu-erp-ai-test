name: Protocolo V1.1 Validator & Feed

on:
  push:
    branches: [main]
    paths:
      - 'protocol/v1/messages/**'
      - 'protocol/v1/acks/**'
      - 'protocol/v1/schemas/**'
      - 'tools/validate_v1.py'
      - '.github/workflows/protocol-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'protocol/v1/**'
      - 'tools/**'
      - '.github/workflows/protocol-v1.yml'

permissions:
  contents: write

concurrency:
  group: protocol-v1-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar pruebas unitarias del validador
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Validar mensajes, ACKs e inmutabilidad
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/validate_v1.py --root . --base-ref "origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python3 tools/validate_v1.py --root . --base-ref "${{ github.event.before }}"
          else
            python3 tools/validate_v1.py --root .
          fi

      - name: Regenerar feeds e index.json en main (serializado y sin ocultar errores)
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/validate_v1.py --root . --build-index
            if [ -z "$(git status --porcelain protocol/v1/index.json protocol/v1/feed)" ]; then
              echo "Feeds e index.json ya están actualizados."
              exit 0
            fi
            git add protocol/v1/index.json protocol/v1/feed
            git commit -m "chore(protocol-v1.1): actualizar feed e index.json"
            if git push origin main; then
              exit 0
            fi
            echo "Conflicto al hacer push (intento $attempt/3); reintentando sobre origin/main..."
            sleep 2
          done
          echo "ERROR: no se pudo publicar feed/index.json tras 3 intentos" >&2
          exit 1
